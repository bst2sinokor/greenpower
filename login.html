<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부산그린파워 - 로그인</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
    background: linear-gradient(135deg, #0f2740 0%, #1a3a5c 40%, #1e4d7b 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-wrap {
    width: 100%;
    max-width: 400px;
}

.login-logo {
    text-align: center;
    margin-bottom: 32px;
    color: white;
}

.login-logo .company-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    margin-bottom: 16px;
}

.login-logo .green-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.3); }
}

.login-logo h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
}

.login-logo p {
    font-size: 13px;
    opacity: 0.6;
}

.login-card {
    background: white;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.login-card h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 24px;
    text-align: center;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.field input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(16,185,129,0.12);
}

.btn-login {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: white;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(16,185,129,0.3);
}

.btn-login:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(16,185,129,0.4);
}

.btn-login:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.error-msg {
    background: #fee2e2;
    color: #991b1b;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
}

.login-footer {
    text-align: center;
    margin-top: 24px;
    color: rgba(255,255,255,0.4);
    font-size: 11px;
}
</style>
</head>
<body>
<div class="login-wrap">
    <div class="login-logo">
        <div class="company-badge">
            <div class="green-dot"></div>
            SINOKOR 계열사
        </div>
        <h1>부산그린파워</h1>
        <p>산업폐기물매립 운영관리 시스템</p>
    </div>

    <div class="login-card">
        <h2>로그인</h2>
        <div class="field">
            <label>이메일</label>
            <input type="email" id="email" placeholder="이메일 주소 입력" autocomplete="email">
        </div>
        <div class="field">
            <label>비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호 입력" autocomplete="current-password">
        </div>
        <button class="btn-login" id="btn-login">로그인</button>
        <div class="error-msg" id="error-msg"></div>
    </div>

    <div class="login-footer">
        © 2025 부산그린파워 · 운영관리 시스템
    </div>
</div>

<script src="js/supabase.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    // 이미 로그인 상태면 역할에 따라 리디렉션
    const { data: { user } } = await supabase.auth.getUser();
    if (user) {
        const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
        if (profile) {
            window.location.href = profile.role === 'viewer' ? 'dashboard.html' : 'entry.html';
        }
    }
});

const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('btn-login');
const errorMsg = document.getElementById('error-msg');

function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
}

async function doLogin() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        showError('이메일과 비밀번호를 입력해 주세요.');
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = '로그인 중...';
    errorMsg.style.display = 'none';

    try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        // profiles 테이블에서 역할 조회
        const { data: profile, error: profileError } = await supabase
            .from('profiles')
            .select('role')
            .eq('id', data.user.id)
            .single();

        if (profileError || !profile) throw new Error('사용자 프로필을 찾을 수 없습니다. 관리자에게 문의하세요.');

        // 역할에 따라 리디렉션
        window.location.href = profile.role === 'viewer' ? 'dashboard.html' : 'entry.html';

    } catch (e) {
        loginBtn.disabled = false;
        loginBtn.textContent = '로그인';
        const msg = e.message.includes('Invalid login') ? '이메일 또는 비밀번호가 올바르지 않습니다.' : e.message;
        showError(msg);
    }
}

loginBtn.addEventListener('click', doLogin);
passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') passwordInput.focus(); });
</script>
</body>
</html>
