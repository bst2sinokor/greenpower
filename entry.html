<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부산그린파워 - 일일 데이터 입력</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.entry-header-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 20px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    box-shadow: var(--shadow);
}
.entry-header-bar h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    margin-right: auto;
}
.date-nav { display: flex; align-items: center; gap: 8px; }
.date-nav button {
    background: #f1f5f9;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
}
.date-nav button:hover { background: #e2e8f0; }
.date-nav input[type="date"] {
    padding: 7px 12px;
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--primary);
}
.status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
}
.status-badge.new { background: #dbeafe; color: #1d4ed8; }
.status-badge.edit { background: #fef9c3; color: #854d0e; }

.sections-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
}
@media (max-width: 900px) { .sections-grid { grid-template-columns: 1fr; } }

.section-full { grid-column: 1 / -1; }

.submit-bar {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 0;
}
</style>
</head>
<body>

<header class="app-header">
    <div class="logo">
        <span>🌿 부산그린파워</span>
        <span class="badge">데이터 입력</span>
    </div>
    <div class="header-right">
        <span id="user-name">-</span>
        <button class="btn-logout" id="btn-logout">로그아웃</button>
    </div>
</header>

<main class="main-container">

    <!-- 날짜 선택 바 -->
    <div class="entry-header-bar">
        <h2>일일 운영 실적 입력</h2>
        <div class="date-nav">
            <button id="btn-prev-day">◀ 전날</button>
            <input type="date" id="entry-date">
            <button id="btn-next-day">다음날 ▶</button>
        </div>
        <div class="status-badge new" id="entry-status">● 신규 입력</div>
    </div>

    <!-- 섹션 2열 그리드 -->
    <div class="sections-grid">

        <!-- 섹션 1: 반입량 -->
        <div class="card">
            <div class="card-header">
                <div class="icon">♻</div>
                반입량 현황
            </div>
            <div class="card-body">
                <div class="form-grid" style="grid-template-columns:1fr 1fr;">
                    <div class="form-group">
                        <label>혼합폐기물 <span class="unit">(톤)</span></label>
                        <input type="number" id="intake_mixed" min="0" step="0.1" placeholder="0.0">
                    </div>
                    <div class="form-group">
                        <label>유기성 폐기물 <span class="unit">(톤)</span></label>
                        <input type="number" id="intake_organic" min="0" step="0.1" placeholder="0.0">
                    </div>
                    <div class="form-group">
                        <label>무기성 폐기물 <span class="unit">(톤)</span></label>
                        <input type="number" id="intake_inorganic" min="0" step="0.1" placeholder="0.0">
                    </div>
                    <div class="form-group">
                        <label>건설폐기물 <span class="unit">(톤)</span></label>
                        <input type="number" id="intake_construction" min="0" step="0.1" placeholder="0.0">
                    </div>
                    <div class="form-group">
                        <label>특수/지정 폐기물 <span class="unit">(톤)</span></label>
                        <input type="number" id="intake_special" min="0" step="0.1" placeholder="0.0">
                    </div>
                    <div class="form-group">
                        <label>차량 대수 <span class="unit">(대)</span></label>
                        <input type="number" id="truck_count" min="0" step="1" placeholder="0">
                    </div>
                </div>
                <div class="total-row" style="margin-top:12px;">
                    <span class="label">총 반입량</span>
                    <span class="value"><span id="total-intake">0.0</span> 톤</span>
                </div>
            </div>
        </div>

        <!-- 섹션 2: 구역별 매립 현황 -->
        <div class="card">
            <div class="card-header">
                <div class="icon">🏗</div>
                구역별 매립 현황 (누적)
            </div>
            <div class="card-body">
                <p style="font-size:11px;color:var(--text-muted);margin-bottom:12px;">
                    각 구역의 <strong>오늘 기준 누적 매립량</strong>을 입력하세요.
                </p>
                <div class="form-grid" style="grid-template-columns:1fr 1fr;">
                    <div class="form-group">
                        <label>1구역 누적 매립량 <span class="unit">(m³)</span></label>
                        <input type="number" id="phase1_used_m3" min="0" step="1" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>2구역 누적 매립량 <span class="unit">(m³)</span></label>
                        <input type="number" id="phase2_used_m3" min="0" step="1" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>3구역 누적 매립량 <span class="unit">(m³)</span></label>
                        <input type="number" id="phase3_used_m3" min="0" step="1" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>4구역 누적 매립량 <span class="unit">(m³)</span></label>
                        <input type="number" id="phase4_used_m3" min="0" step="1" placeholder="0">
                    </div>
                </div>
                <div class="form-group" style="margin-top:12px;">
                    <label>당일 매립 투입량 <span class="unit">(m³)</span></label>
                    <input type="number" id="landfill_volume_m3" min="0" step="0.1" placeholder="0.0">
                </div>
            </div>
        </div>

        <!-- 섹션 3: 수익 -->
        <div class="card">
            <div class="card-header">
                <div class="icon">💰</div>
                수익 현황 (처리 수수료)
            </div>
            <div class="card-body">
                <div class="form-grid" style="grid-template-columns:1fr 1fr;">
                    <div class="form-group">
                        <label>혼합폐기물 <span class="unit">(원)</span></label>
                        <input type="number" id="revenue_mixed" min="0" step="1000" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>유기성 <span class="unit">(원)</span></label>
                        <input type="number" id="revenue_organic" min="0" step="1000" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>무기성 <span class="unit">(원)</span></label>
                        <input type="number" id="revenue_inorganic" min="0" step="1000" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>건설폐기물 <span class="unit">(원)</span></label>
                        <input type="number" id="revenue_construction" min="0" step="1000" placeholder="0">
                    </div>
                    <div class="form-group" style="grid-column:1/-1;">
                        <label>특수/지정 <span class="unit">(원)</span></label>
                        <input type="number" id="revenue_special" min="0" step="1000" placeholder="0">
                    </div>
                </div>
                <div class="total-row" style="margin-top:12px;">
                    <span class="label">총 수입</span>
                    <span class="value"><span id="total-revenue">0</span> 원</span>
                </div>
            </div>
        </div>

        <!-- 섹션 4: 처리 비용 -->
        <div class="card">
            <div class="card-header">
                <div class="icon">📋</div>
                처리 비용
            </div>
            <div class="card-body">
                <div class="form-grid" style="grid-template-columns:1fr 1fr;">
                    <div class="form-group">
                        <label>인건비 <span class="unit">(원)</span></label>
                        <input type="number" id="cost_labor" min="0" step="1000" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>장비 운영비 <span class="unit">(원)</span></label>
                        <input type="number" id="cost_equipment" min="0" step="1000" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>복토재 비용 <span class="unit">(원)</span></label>
                        <input type="number" id="cost_cover_soil" min="0" step="1000" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>침출수 처리비 <span class="unit">(원)</span></label>
                        <input type="number" id="cost_leachate" min="0" step="1000" placeholder="0">
                    </div>
                    <div class="form-group" style="grid-column:1/-1;">
                        <label>기타 비용 <span class="unit">(원)</span></label>
                        <input type="number" id="cost_other" min="0" step="1000" placeholder="0">
                    </div>
                </div>
                <div class="total-row" style="margin-top:12px;">
                    <span class="label">총 비용</span>
                    <span class="value"><span id="total-cost">0</span> 원</span>
                </div>
            </div>
        </div>

        <!-- 섹션 5: 환경 모니터링 -->
        <div class="card">
            <div class="card-header">
                <div class="icon">🌡</div>
                환경 모니터링
            </div>
            <div class="card-body">
                <div class="form-grid" style="grid-template-columns:1fr 1fr;">
                    <div class="form-group">
                        <label>침출수 발생량 <span class="unit">(m³)</span></label>
                        <input type="number" id="leachate_generated_m3" min="0" step="0.1" placeholder="0.0">
                    </div>
                    <div class="form-group">
                        <label>침출수 처리량 <span class="unit">(m³)</span></label>
                        <input type="number" id="leachate_treated_m3" min="0" step="0.1" placeholder="0.0">
                    </div>
                    <div class="form-group">
                        <label>매립가스 메탄 <span class="unit">(ppm)</span></label>
                        <input type="number" id="gas_methane_ppm" min="0" step="0.1" placeholder="0.0">
                    </div>
                    <div class="form-group">
                        <label>황화수소 (H₂S) <span class="unit">(ppm)</span></label>
                        <input type="number" id="gas_h2s_ppm" min="0" step="0.1" placeholder="0.0">
                    </div>
                </div>
            </div>
        </div>

        <!-- 섹션 6: 특이사항 -->
        <div class="card">
            <div class="card-header">
                <div class="icon">📝</div>
                특이사항 메모
            </div>
            <div class="card-body">
                <textarea id="memo" rows="6" placeholder="당일 특이사항, 민원, 장비 고장, 점검 사항 등을 자유롭게 기입하세요."
                    style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;resize:vertical;line-height:1.7;"></textarea>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
                    <span style="font-size:11px;color:var(--text-muted);">오늘의 영업이익</span>
                    <span style="font-size:18px;font-weight:700;" id="profit-preview">-</span>
                </div>
            </div>
        </div>

    </div><!-- /.sections-grid -->

    <!-- 저장 버튼 -->
    <div class="submit-bar">
        <button class="btn btn-secondary" id="btn-clear">초기화</button>
        <button class="btn btn-primary" id="btn-save" style="padding:12px 40px;font-size:15px;">
            💾 저장하기
        </button>
    </div>

</main>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/entry.js"></script>
</body>
</html>
